<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Calculater</h1>
    <main>
        <input type="text" readonly>
        <div class="buts">
            <div class="line1">
                <button style="color: #F2F1EC;">⌫</button>
                <button style="color: #F2F1EC;">C</button>
                <button class="o">%</button>
                <button class="o">/</button>
            </div>
            <div class="line2">
                <button>7</button>
                <button>8</button>
                <button>9</button>
                <button class="o">x</button>
            </div>
            <div class="line3">
                <button>4</button>
                <button>5</button>
                <button>6</button>
                <button class="o">-</button>
            </div>
            <div class="line4">
                <button>1</button>
                <button>2</button>
                <button>3</button>
                <button class="o">+</button>
            </div>
            <div class="line5">
                <button>.</button>
                <button>0</button>
                <button class="o">^</button>
                <button style="color: #FF6A39;">=</button>
            </div>
        </div>
    </main>
    <script src="./script.js"></script>
</body>
</html>
